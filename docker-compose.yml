version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: synknote
      MONGO_INITDB_ROOT_PASSWORD: admin1234

    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: